<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>vstunnel - Copilot Remote</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <!-- Connection Setup -->
    <div id="setupPanel" class="panel">
        <h1>vstunnel</h1>
        <p class="subtitle">Remote Copilot Monitor</p>
        <div class="form-group">
            <label for="relayUrl">Relay Server URL</label>
            <input type="url" id="relayUrl" placeholder="http://vstunnel.siemens.internal:8080">
        </div>
        <button id="btnConnect" class="btn btn-primary">Connect</button>
        <div id="setupError" class="error-msg hidden"></div>
    </div>

    <!-- User Selection -->
    <div id="userPanel" class="panel hidden">
        <h2>Select User</h2>
        <div id="userList" class="user-list"></div>
        <div class="form-group">
            <label for="authToken">Auth Token</label>
            <input type="text" id="authToken" placeholder="Paste token from laptop terminal">
        </div>
        <button id="btnAuth" class="btn btn-primary" disabled>Connect to User</button>
        <button id="btnDisconnect" class="btn btn-secondary">Back</button>
    </div>

    <!-- Main Interface -->
    <div id="mainPanel" class="panel hidden">
        <!-- Approval Banner -->
        <div id="approvalBanner" class="approval-banner hidden">
            <div class="approval-text" id="approvalText"></div>
            <div class="approval-actions">
                <button id="btnAccept" class="btn btn-accept">Accept</button>
                <button id="btnReject" class="btn btn-reject">Reject</button>
            </div>
        </div>

        <!-- Workspace Tabs -->
        <div id="workspaceTabs" class="workspace-tabs">
            <button class="ws-tab active" data-instance="all">All</button>
        </div>

        <!-- Content Tabs -->
        <div class="tab-bar">
            <button class="tab active" data-tab="activity">Activity</button>
            <button class="tab" data-tab="diff">Diff</button>
            <button class="tab" data-tab="prompt">Prompt</button>
        </div>

        <!-- Activity Tab -->
        <div id="tabActivity" class="tab-content active">
            <div id="activityFeed" class="activity-feed">
                <div class="empty-state">Waiting for Copilot activity...</div>
            </div>
        </div>

        <!-- Diff Tab -->
        <div id="tabDiff" class="tab-content">
            <div id="diffHeader" class="diff-header">
                <span id="diffStats">No changes yet</span>
                <button id="btnRefreshDiff" class="btn btn-small">Refresh</button>
            </div>
            <div id="diffContent" class="diff-content">
                <div class="empty-state">No file changes detected</div>
            </div>
        </div>

        <!-- Prompt Tab -->
        <div id="tabPrompt" class="tab-content">
            <div class="prompt-target">
                <label>Target:</label>
                <select id="promptTarget">
                    <option value="active_session">Active Session</option>
                    <option value="new_chat">New Chat</option>
                    <option value="inline">Inline Edit</option>
                </select>
            </div>
            <textarea id="promptInput" placeholder="Send a follow-up prompt to Copilot..." rows="4"></textarea>
            <div class="prompt-actions">
                <button id="btnSendPrompt" class="btn btn-primary">Send</button>
                <button id="btnQuickContinue" class="btn btn-secondary">Continue</button>
                <button id="btnQuickExplain" class="btn btn-secondary">Explain</button>
            </div>
            <div id="promptHistory" class="prompt-history"></div>
        </div>

        <!-- Status Bar -->
        <div class="status-bar">
            <span id="statusDot" class="status-dot connected"></span>
            <span id="statusText">Connected</span>
            <button id="btnMainDisconnect" class="btn btn-small btn-secondary">Disconnect</button>
        </div>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>

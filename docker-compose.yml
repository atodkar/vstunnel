services:
  daemon:
    build: .
    container_name: vstunnel-daemon
    ports:
      - "8080:8080"
    environment:
      DAEMON_HOST: "0.0.0.0"
      DAEMON_PORT: "8080"
      LOG_LEVEL: "INFO"
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
